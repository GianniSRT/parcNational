<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Croisières Marseille Calanques</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="src/images/logo.png" 
           alt="Logo" width="50" height="50" class="me-2">
      <span class="fw-bold">Croisières Marseille Calanques</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="sentier.html">Sentiers</a></li>
        <li class="nav-item"><a class="nav-link" href="camping.html">Campings</a></li>
        <li class="nav-item"><a class="nav-link" href="reservation.html">Réservations</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
        <li class="nav-item" id="adminBtn" style="display:none;">
          <a class="btn btn-warning text-white ms-2" href="admin.html">Administrateur</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 class="mb-4">Espace Administration</h1>
  <div class="card mb-4">
    <div class="card-header">
      Ajouter un sentier
    </div>
    <div class="card-body">
      <form id="addSentierForm" class="row g-3">
        <div class="col-md-6">
          <label for="nomSentier" class="form-label">Nom du sentier</label>
          <input type="text" class="form-control" id="nomSentier" required>
        </div>
        <div class="col-md-6">
          <label for="descriptionSentier" class="form-label">Description</label>
          <input type="text" class="form-control" id="descriptionSentier" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-success">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      Liste des sentiers
    </div>
    <div class="card-body">
      <table class="table" id="sentiersTable">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Sentiers ajoutés ici dynamiquement -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="src/js/adminButton.js"></script>
<script src="src/js/adminSentier.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
